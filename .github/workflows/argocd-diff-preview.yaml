name: argocd-diff-preview

on:
  pull_request:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - ".github/workflows/argocd-diff-preview.yaml"

jobs:
  diff-preview:
    # This job runs on a self-hosted runner inside the cluster network, so it
    # must never execute code from fork pull requests.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: arc-infra
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: pull-request
          persist-credentials: false

      - name: Checkout main branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Set Argo CD custom values
        run: |
          cat > values.yaml << "EOF"
          configs:
            cm:
              kustomize.buildOptions: --enable-helm
          EOF

      - name: Generate diff
        run: |
          docker run \
            --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/main:/base-branch \
            -v $(pwd)/pull-request:/target-branch \
            -v $(pwd)/output:/output \
            -v $(pwd)/values.yaml:/argocd-config/values.yaml \
            -e TARGET_BRANCH=refs/pull/${{ github.event.number }}/merge \
            -e REPO=${{ github.repository }} \
            dagandersen/argocd-diff-preview:v0.2.11@sha256:2828dfafbee281436efbfcf0f39ce055351aea9159130c13d771688946406568

      # The arc runner image ships without the gh CLI
      - name: Install gh CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gh

      - name: Post diff as comment
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
