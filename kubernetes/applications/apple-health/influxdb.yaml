---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: influxdb
  namespace: apple-health
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: influxdb-secret
  data:
    - secretKey: DOCKER_INFLUXDB_INIT_PASSWORD
      remoteRef:
        key: apple-health-influxdb-password
    - secretKey: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
      remoteRef:
        key: apple-health-influxdb-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: influxdb-config
  namespace: apple-health
data:
  DOCKER_INFLUXDB_INIT_MODE: setup
  DOCKER_INFLUXDB_INIT_USERNAME: admin
  DOCKER_INFLUXDB_INIT_ORG: apple-health
  DOCKER_INFLUXDB_INIT_BUCKET: apple-health
  INFLUXD_REPORTING_DISABLED: "true"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
  namespace: apple-health
spec:
  serviceName: influxdb
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
        - name: influxdb
          image: influxdb:2.9.1
          ports:
            - name: http
              containerPort: 8086
          envFrom:
            - configMapRef:
                name: influxdb-config
            - secretRef:
                name: influxdb-secret
          volumeMounts:
            - name: influxdb-data
              mountPath: /var/lib/influxdb2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: influxdb-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: apple-health
spec:
  selector:
    app: influxdb
  ports:
    - name: http
      port: 8086
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: influxdb
  namespace: apple-health
spec:
  podSelector:
    matchLabels:
      app: influxdb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: apple-health-ingester
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apple-health-mcp
          podSelector:
            matchLabels:
              app: apple-health-mcp
      ports:
        - protocol: TCP
          port: 8086
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
