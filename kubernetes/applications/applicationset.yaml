---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  # Use Go text/template syntax (`{{.path.basename}}`) for template
  # substitution instead of the legacy fasttemplate.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Preserve cluster resources when an Application is removed from the
  # generator output. This makes directory renames safe: the old Application
  # gets deleted without pruning the workload; the newly-named Application
  # adopts the existing resources on its first sync.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/toof-jp/infra
        revision: HEAD
        directories:
          - path: kubernetes/applications/*
          # These directories provide supplementary manifests for multi-source
          # Applications defined in kubernetes/applications/{headlamp,immich}.yaml
          # and must not spawn their own Applications.
          - path: kubernetes/applications/headlamp
            exclude: true
          - path: kubernetes/applications/immich
            exclude: true
  template:
    metadata:
      name: "{{.path.basename}}"
      namespace: argocd
    spec:
      project: toof-infra
      source:
        repoURL: https://github.com/toof-jp/infra
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
