---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: archiveteam-warrior
            namespace: archiveteam-warrior
          - name: arc-runners
            namespace: arc-runners
          - name: arc-systems
            namespace: arc-systems
          - name: argocd
            namespace: argocd
          - name: bbs
            namespace: bbs
          - name: beancount
            namespace: beancount
          - name: blues
            namespace: blues
          - name: cdi
            namespace: cdi
          - name: cloudflare-external-secret
            namespace: cloudflare
          - name: dev-vm
            namespace: dev-vm
          - name: external-secrets
            namespace: external-secrets
          - name: healthcheck
            namespace: healthcheck
          - name: immich-mcp
            namespace: immich-mcp
          - name: kubevirt
            namespace: kubevirt
          - name: mcp-gate
            namespace: mcp-gate
          - name: monitoring
            namespace: monitoring
          - name: npm-stats
            namespace: npm-stats
          - name: obsidian
            namespace: obsidian
          - name: obsidian-msp
            namespace: obsidian-msp
          - name: openclaw
            namespace: openclaw
          - name: palworld
            namespace: palworld
          - name: shisha-log
            namespace: shisha-log
  template:
    metadata:
      name: "{{name}}"
      namespace: argocd
    spec:
      project: toof-infra
      source:
        repoURL: https://github.com/toof-jp/infra
        targetRevision: HEAD
        path: "kubernetes/applications/{{name}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
