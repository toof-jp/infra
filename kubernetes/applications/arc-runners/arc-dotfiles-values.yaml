---
githubConfigUrl: https://github.com/toof-jp/dotfiles
githubConfigSecret: arc-github-app
minRunners: 1
maxRunners: 1
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
template:
  spec:
    nodeSelector:
      kubernetes.io/hostname: zen2
    initContainers:
      - name: init-nix-owner
        image: ghcr.io/actions/actions-runner:2.335.1
        command: ["sh", "-c", "chown runner:runner /nix && chmod g-s /nix"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: nix
            mountPath: /nix
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.335.1
        command: ["/home/runner/run.sh"]
        volumeMounts:
          - name: nix
            mountPath: /nix
    volumes:
      - name: nix
        persistentVolumeClaim:
          claimName: arc-dotfiles-nix
