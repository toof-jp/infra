---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fetch-post-discord-bot-external-secret
  namespace: bbs
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: fetch-post-discord-bot-secret
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef:
        key: bbs-fetch-post-discord-bot-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: search-post-discord-bot-external-secret
  namespace: bbs
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: search-post-discord-bot-secret
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef:
        key: bbs-search-post-discord-bot-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-webhook-external-secret
  namespace: bbs
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: discord-webhook-secret
  data:
    - secretKey: WEBHOOK_URL
      remoteRef:
        key: bbs-discord-webhook-url
    - secretKey: IMAGE_URL_PREFIX
      remoteRef:
        key: bbs-discord-webhook-image-url-prefix
    - secretKey: REDIS_URL
      remoteRef:
        key: bbs-discord-webhook-redis-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-external-secret
  namespace: bbs
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: postgres-secret
    template:
      type: Opaque
      data:
        POSTGRES_USER: user
        POSTGRES_DB: bbs
        POSTGRES_PASSWORD: "{{ .password }}"
        DATABASE_URL: >-
          postgresql://user:{{ .password }}@postgres:5432/bbs
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: "postgres-password"
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: password
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 42
      digits: 0
      symbols: 0
      symbolCharacters: ""
      allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: search-crawler-external-secret
  namespace: bbs
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: search-crawler-secret
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: bbs-search-crawler-aws-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: bbs-search-crawler-aws-secret-access-key
    - secretKey: MAIL_TEL
      remoteRef:
        key: bbs-search-crawler-mail-tel
    - secretKey: PASSWORD
      remoteRef:
        key: bbs-search-crawler-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mydns-jp-updater-secret
  namespace: bbs
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: mydns-jp-updater-secret
  data:
    - secretKey: MASTER_ID
      remoteRef:
        key: mydns.jp/MASTER_ID
    - secretKey: PASSWORD
      remoteRef:
        key: mydns.jp/PASSWORD
    - secretKey: IPV4ADDR
      remoteRef:
        key: mydns.jp/IPV4ADDR
