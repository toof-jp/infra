---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: bbs
spec:
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/toof-jp/bbs-mcp-server:latest@sha256:9f4c89d097f7db58f77e3866c3796047ae1b1e2fb4eb816c33b5f1025e460dac
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_BASE_URL
              value: http://search-backend.bbs.svc.cluster.local:3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: bbs
spec:
  selector:
    app: mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server
  namespace: bbs
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: bbs-mcp.toof.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-server
                port:
                  number: 8080
