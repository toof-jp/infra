---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-backend
  namespace: bbs
spec:
  selector:
    matchLabels:
      app: search-backend
  template:
    metadata:
      labels:
        app: search-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres-rw -p 5432; do sleep 2; done
      containers:
        - name: search-backend
          image: ghcr.io/toof-jp/bbs-search-backend:sha-a6eebce
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: postgres-secret
---
apiVersion: v1
kind: Service
metadata:
  name: search-backend
  namespace: bbs
spec:
  selector:
    app: search-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-backend
  namespace: bbs
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: bbs.toof.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: search-backend
                port:
                  number: 3000
