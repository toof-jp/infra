---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beancount-mcp-git-ssh
  namespace: beancount-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: beancount-mcp-git-ssh
    template:
      engineVersion: v2
      data:
        # 1Password SDK strips the trailing newline; OpenSSH refuses a key
        # without it ("error in libcrypto"), so re-append via block scalar.
        id_ed25519: |
          {{ .id_ed25519 }}
        known_hosts: |
          {{ .known_hosts }}
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: beancount/git-ssh/id_ed25519
    - secretKey: known_hosts
      remoteRef:
        key: beancount/git-ssh/known_hosts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beancount-mcp
  namespace: beancount-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beancount-mcp
  template:
    metadata:
      labels:
        app: beancount-mcp
    spec:
      securityContext:
        fsGroup: 65533 # git-sync runs as UID 65533; makes the SSH key group-readable
      initContainers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          restartPolicy: Always
          args:
            - --repo=git@github.com:toof-jp/beancount-ledger.git
            - --ref=main
            - --period=60s
            - --root=/data
            - --link=current
            - --ssh-key-file=/etc/git-secret/id_ed25519
            - --ssh-known-hosts-file=/etc/git-secret/known_hosts
          startupProbe:
            exec:
              command: ["test", "-e", "/data/current"]
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: repo
              mountPath: /data
            - name: git-ssh
              mountPath: /etc/git-secret
              readOnly: true
      containers:
        - name: beancount-mcp
          image: ghcr.io/toof-jp/beancount-mcp-server:sha-ec0387a
          # The image entrypoint speaks stdio; serve Streamable HTTP at /mcp
          # for mcp-gate instead.
          command:
            - python
            - -c
            - |
              from beancount_mcp_server.server import mcp
              mcp.settings.host = "0.0.0.0"
              mcp.settings.port = 3000
              # FastMCP auto-enables DNS rebinding protection because it is
              # constructed with the default host=127.0.0.1; drop it so
              # mcp-gate can proxy requests using the in-cluster hostname.
              mcp.settings.transport_security = None
              mcp.run(transport="streamable-http")
          env:
            - name: BEANCOUNT_FILE
              value: /data/current/ledger.beancount
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: repo
              mountPath: /data
              readOnly: true
      volumes:
        - name: repo
          emptyDir: {}
        - name: git-ssh
          secret:
            secretName: beancount-mcp-git-ssh
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: beancount-mcp
  namespace: beancount-mcp
spec:
  selector:
    app: beancount-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beancount-mcp
  namespace: beancount-mcp
spec:
  podSelector:
    matchLabels:
      app: beancount-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-gate
          podSelector:
            matchLabels:
              app: mcp-gate-beancount
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # git-sync fetches the ledger over SSH
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 22
        - protocol: TCP
          port: 443
