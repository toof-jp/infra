apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beancount-git-ssh
  namespace: beancount
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: beancount-git-ssh
    template:
      engineVersion: v2
      data:
        # 1Password SDK strips the trailing newline; OpenSSH refuses a key
        # without it ("error in libcrypto"), so re-append via block scalar.
        id_ed25519: |
          {{ .id_ed25519 }}
        known_hosts: |
          {{ .known_hosts }}
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: beancount/git-ssh/id_ed25519
    - secretKey: known_hosts
      remoteRef:
        key: beancount/git-ssh/known_hosts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fava
  namespace: beancount
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fava
  template:
    metadata:
      labels:
        app: fava
    spec:
      # Prevent the "fava" Service from injecting FAVA_PORT=tcp://... which
      # collides with the env var the yegle/fava image uses as its port number.
      enableServiceLinks: false
      securityContext:
        fsGroup: 65533 # git-sync runs as UID 65533; makes the SSH key group-readable
      initContainers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          restartPolicy: Always
          args:
            - --repo=git@github.com:toof-jp/beancount-ledger.git
            - --ref=main
            - --period=60s
            - --root=/data
            - --link=current
            - --ssh-key-file=/etc/git-secret/id_ed25519
            - --ssh-known-hosts-file=/etc/git-secret/known_hosts
          startupProbe:
            exec:
              command: ["test", "-e", "/data/current"]
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: repo
              mountPath: /data
            - name: git-ssh
              mountPath: /etc/git-secret
              readOnly: true
      containers:
        - name: fava
          image: yegle/fava:v1.30
          env:
            - name: BEANCOUNT_FILE
              value: /data/current/ledger.beancount
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: repo
              mountPath: /data
              readOnly: true
      volumes:
        - name: repo
          emptyDir: {}
        - name: git-ssh
          secret:
            secretName: beancount-git-ssh
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: fava
  namespace: beancount
spec:
  selector:
    app: fava
  ports:
    - name: http
      port: 5000
      targetPort: http
