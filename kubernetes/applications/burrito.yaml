---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: burrito
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/padok-team/charts/burrito
    chart: burrito
    targetRevision: "0.9.1"
    helm:
      releaseName: burrito
      valuesObject:
        server:
          ingress:
            enabled: true
            host: burrito.toof.jp
            ingressClassName: cloudflare-tunnel
  destination:
    server: https://kubernetes.default.svc
    namespace: burrito-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
