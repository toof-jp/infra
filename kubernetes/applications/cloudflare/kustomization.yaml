---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudflare
# ServerSideApply was set at the Application level on the old
# cloudflare-tunnel-ingress-controller root .yaml; preserve it as a
# per-resource sync-option on every rendered manifest.
commonAnnotations:
  argocd.argoproj.io/sync-options: ServerSideApply=true
resources:
  - namespace.yaml
  - external-secret.yaml
helmCharts:
  - name: cloudflare-tunnel-ingress-controller
    repo: https://helm.strrl.dev
    version: 0.0.24
    releaseName: cloudflare-tunnel-ingress-controller
    namespace: cloudflare
    valuesInline:
      cloudflare:
        secretRef:
          name: cloudflare-secret
          accountIDKey: account-id
          tunnelNameKey: tunnel-name
          apiTokenKey: api-token
