---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-mcp
  namespace: immich-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: immich-mcp-secret
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: immich-mcp-api-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-mcp-config
  namespace: immich-mcp
data:
  IMMICH_BASE_URL: http://immich-server.immich.svc.cluster.local:2283
  MCP_PORT: "5000"
  DOWNLOAD_MODE: base64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-mcp
  namespace: immich-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-mcp
  template:
    metadata:
      labels:
        app: immich-mcp
    spec:
      containers:
        - name: immich-mcp
          image: ghcr.io/toof-jp/immichmcp:v3.1.5-base64.1
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: immich-mcp-config
            - secretRef:
                name: immich-mcp-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: immich-mcp
  namespace: immich-mcp
spec:
  selector:
    app: immich-mcp
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-mcp
  namespace: immich-mcp
spec:
  podSelector:
    matchLabels:
      app: immich-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-gate
          podSelector:
            matchLabels:
              app: mcp-gate-immich
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
      ports:
        - protocol: TCP
          port: 2283
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
