---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-proxy-nginx
  namespace: immich
data:
  default.conf: |
    log_format tracker '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_cf_connecting_ip" "$http_cf_ipcountry" $request_time';
    map $http_upgrade $connection_upgrade {
      default upgrade;
      "" close;
    }
    server {
      listen 8080;
      server_name _;
      access_log /var/log/nginx-tracker/access.log tracker;
      client_max_body_size 0;
      location = /healthz {
        access_log off;
        return 200;
      }
      location / {
        proxy_pass http://immich-server:2283;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-proxy-exporter
  namespace: immich
data:
  config.yaml: |
    listen:
      port: 4040
    namespaces:
      - name: immich
        format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_cf_connecting_ip" "$http_cf_ipcountry" $request_time'
        source:
          files:
            - /var/log/nginx-tracker/access.log
        histogram_buckets: [0.01, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-proxy
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-proxy
  template:
    metadata:
      labels:
        app: immich-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: zen2
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: access-log
              mountPath: /var/log/nginx-tracker
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
        - name: exporter
          image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
          args:
            - -config-file
            - /etc/nginxlog-exporter/config.yaml
          ports:
            - name: metrics
              containerPort: 4040
          volumeMounts:
            - name: exporter-conf
              mountPath: /etc/nginxlog-exporter
            - name: access-log
              mountPath: /var/log/nginx-tracker
      volumes:
        - name: nginx-conf
          configMap:
            name: immich-proxy-nginx
        - name: exporter-conf
          configMap:
            name: immich-proxy-exporter
        - name: access-log
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-proxy
  namespace: immich
  labels:
    app: immich-proxy
spec:
  selector:
    app: immich-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 4040
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-proxy
  namespace: immich
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: immich-proxy
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-proxy
  namespace: immich
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: photo.toof.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-proxy
                port:
                  number: 8080
