---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration: {}
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}
  # Only zen2 (bare metal) has /dev/kvm; the VPS nodes cannot run VMs
  workloads:
    nodePlacement:
      nodeSelector:
        kubernetes.io/hostname: zen2
