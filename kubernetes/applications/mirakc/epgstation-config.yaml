---
apiVersion: v1
kind: ConfigMap
metadata:
  name: epgstation-config
  namespace: mirakc
data:
  # EPGStation v2 main config. SQLite keeps the stack single-node and
  # avoids running a separate DB pod. Recorded files land on a Longhorn
  # PVC mounted at /app/recorded.
  config.yml: |
    port: 8888
    socketioPort: 8889

    mirakurunPath: 'http://mirakc:40772'

    dbtype: sqlite

    encodeProcessNum: 2
    concurrentEncodeNum: 1

    recorded:
      - name: recorded
        path: '/app/recorded'
    recordedFormat: '%YEAR%%MONTH%%DAY%_%HOUR%%MIN%%SEC%_%TITLE%_%CHANNEL%'
    fileExtension: '.m2ts'

    thumbnail: '/app/thumbnail'
    thumbnailSize: '480x270'

    dropLog: '/app/drop'

    ffmpeg: '/usr/bin/ffmpeg'
    ffprobe: '/usr/bin/ffprobe'

    isSuppressReservesUpdateAllLog: true
    isAllowedSameNameRecording: true

  # log4js configs. The bundled *.sample.yml references %OperatorSystem%
  # style filename tokens that EPGStation only substitutes when the
  # corresponding *Log paths are set in config.yml; without them log4js
  # blows up validating the filename regex. Ship a minimal stdout-only
  # config so kubectl logs picks up everything.
  operatorLogConfig.yml: |
    appenders:
      stdout:
        type: stdout
    categories:
      default:
        appenders: [stdout]
        level: info
      system:
        appenders: [stdout]
        level: info
      access:
        appenders: [stdout]
        level: info
      stream:
        appenders: [stdout]
        level: info

  epgUpdaterLogConfig.yml: |
    appenders:
      stdout:
        type: stdout
    categories:
      default:
        appenders: [stdout]
        level: info
      system:
        appenders: [stdout]
        level: info
      access:
        appenders: [stdout]
        level: info
      stream:
        appenders: [stdout]
        level: info

  serviceLogConfig.yml: |
    appenders:
      stdout:
        type: stdout
    categories:
      default:
        appenders: [stdout]
        level: info
      system:
        appenders: [stdout]
        level: info
      access:
        appenders: [stdout]
        level: info
      stream:
        appenders: [stdout]
        level: info
