---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mirakc-epg
  namespace: mirakc
  labels:
    recurring-job-group.longhorn.io/daily: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirakc
  namespace: mirakc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mirakc
  template:
    metadata:
      labels:
        app: mirakc
      annotations:
        # Force pod restart when config changes (kustomize doesn't hash
        # ConfigMaps for us here — restart via checksum is the simplest
        # trigger and keeps mirakc in sync with the EPG DB.)
        checksum/config: "v1"
    spec:
      # nuc is the only node with the tuners and B-CAS reader plugged in
      # (and where hostPath /dev/dvb / /run/pcscd exist).
      nodeSelector:
        kubernetes.io/hostname: nuc
      securityContext:
        # Grant the "video" host group (GID 26) so /dev/dvb/adapter*/*
        # (mode 0660 root:video) is readable/writable inside the pod.
        supplementalGroups: [26]
      containers:
        - name: mirakc
          image: ghcr.io/toof-jp/infra-mirakc:latest@sha256:ced73ad64c67b2f9709d526e5a4dfc52674d837a041f19837e93c8972a5583eb
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: MIRAKC_CONFIG
              value: /etc/mirakc/config.yml
            - name: RUST_LOG
              value: info
          ports:
            - name: http
              containerPort: 40772
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            # DVB frontend ioctls are blocked by the default device
            # cgroup even for root+video-group, so recisdb sees EPERM
            # opening /dev/dvb/adapterN/frontend0. Kubernetes has no
            # per-device allowlist outside a full device plugin, so
            # this is the pragmatic escape hatch for a single-node
            # home tuner setup.
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /etc/mirakc/config.yml
              subPath: config.yml
              readOnly: true
            - name: epg
              mountPath: /var/lib/mirakc/epg
            - name: dvb
              mountPath: /dev/dvb
            - name: pcscd
              mountPath: /run/pcscd
      volumes:
        - name: config
          configMap:
            name: mirakc-config
        - name: epg
          persistentVolumeClaim:
            claimName: mirakc-epg
        - name: dvb
          hostPath:
            path: /dev/dvb
            type: Directory
        - name: pcscd
          hostPath:
            path: /run/pcscd
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: mirakc
  namespace: mirakc
spec:
  selector:
    app: mirakc
  ports:
    - name: http
      port: 40772
      targetPort: http
