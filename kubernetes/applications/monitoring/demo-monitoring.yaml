---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-monitoring
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: demo-monitoring
  template:
    metadata:
      labels:
        app: demo-monitoring
    spec:
      containers:
        - name: demo-monitoring
          image: ghcr.io/toof-jp/webinar-opentelemetry-getting-started:sha-3c0b15a
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
---
apiVersion: v1
kind: Service
metadata:
  name: demo-monitoring
  namespace: monitoring
spec:
  selector:
    app: demo-monitoring
  ports:
    - name: http
      port: 8080
      targetPort: 8080
