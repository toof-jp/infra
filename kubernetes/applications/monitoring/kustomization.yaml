---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
commonAnnotations:
  argocd.argoproj.io/sync-options: ServerSideApply=true
resources:
  - namespace.yaml
  - grafana-admin-secret.yaml
  - otel-collector.yaml
helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 87.19.1
    releaseName: kube-prometheus-stack
    namespace: monitoring
    includeCRDs: true
    valuesInline:
      alertmanager:
        enabled: false
      kubeControllerManager:
        enabled: false
      kubeScheduler:
        enabled: false
      kubeProxy:
        enabled: false
      kubeEtcd:
        enabled: false
      prometheusOperator:
        nodeSelector: &zen2
          kubernetes.io/hostname: zen2
      prometheus:
        prometheusSpec:
          nodeSelector: *zen2
          retention: 15d
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: longhorn
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 20Gi
      kube-state-metrics:
        nodeSelector: *zen2
      prometheus-node-exporter:
        tolerations:
          - operator: Exists
      grafana:
        nodeSelector: *zen2
        admin:
          existingSecret: grafana-admin-secret
          userKey: admin-user
          passwordKey: admin-password
        ingress:
          enabled: true
          ingressClassName: cloudflare-tunnel
          hosts:
            - grafana.toof.jp
        grafana.ini:
          server:
            root_url: https://grafana.toof.jp
