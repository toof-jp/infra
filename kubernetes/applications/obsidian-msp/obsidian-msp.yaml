---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-msp-git-sync
  namespace: obsidian-msp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: obsidian-msp-git-sync
  data:
    - secretKey: GITSYNC_REPO
      remoteRef:
        key: obsidian-msp-git-repository-url
    - secretKey: GITSYNC_USERNAME
      remoteRef:
        key: obsidian-msp-git-username
    - secretKey: GITSYNC_PASSWORD
      remoteRef:
        key: obsidian-msp-git-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-msp
  namespace: obsidian-msp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obsidian-msp
  template:
    metadata:
      labels:
        app: obsidian-msp
    spec:
      securityContext:
        fsGroup: 65533
      containers:
        - name: mcpvault
          image: node:24-alpine
          command:
            - sh
            - -c
          args:
            - |
              until [ -e /git/vault ]; do
                sleep 1
              done
              start() {
                npx --yes mcp-proxy@6.5.2 --port 3001 -- npx --yes @bitbonsai/mcpvault@0.11.0 /git/vault &
                PID=$!
              }
              trap 'kill $PID 2>/dev/null; wait $PID 2>/dev/null; exit 0' TERM INT
              current=$(readlink -f /git/vault)
              start
              while sleep 10; do
                if ! kill -0 $PID 2>/dev/null; then
                  exit 1
                fi
                new=$(readlink -f /git/vault)
                if [ "$new" != "$current" ]; then
                  kill $PID 2>/dev/null || true
                  wait $PID 2>/dev/null || true
                  current=$new
                  start
                fi
              done
          ports:
            - name: http-mcp
              containerPort: 3001
          readinessProbe:
            tcpSocket:
              port: http-mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http-mcp
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: obsidian-vault
              mountPath: /git
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          envFrom:
            - secretRef:
                name: obsidian-msp-git-sync
          args:
            - --ref=HEAD
            - --root=/git/root
            - --link=/git/vault
            - --period=30s
            - --max-failures=-1
            - --group-write
          volumeMounts:
            - name: obsidian-vault
              mountPath: /git
      volumes:
        - name: obsidian-vault
          emptyDir: {}
