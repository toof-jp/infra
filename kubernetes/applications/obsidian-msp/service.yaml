---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-msp
  namespace: obsidian-msp
spec:
  selector:
    app: obsidian-msp
  ports:
    - name: http-mcp
      port: 3001
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsidian-msp-from-mcp-gate
  namespace: obsidian-msp
spec:
  podSelector:
    matchLabels:
      app: obsidian-msp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-gate
          podSelector:
            matchLabels:
              app: mcp-gate-obsidian
      ports:
        - protocol: TCP
          port: 3001
