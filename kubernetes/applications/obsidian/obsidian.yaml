---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-git-ssh
  namespace: obsidian
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: obsidian-git-ssh
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: obsidian/git-ssh/id_ed25519
    - secretKey: known_hosts
      remoteRef:
        key: obsidian/git-ssh/known_hosts
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obsidian-config
  namespace: obsidian
  labels:
    recurring-job-group.longhorn.io/daily: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian
  namespace: obsidian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian
  template:
    metadata:
      labels:
        app: obsidian
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: obsidian
          image: lscr.io/linuxserver/obsidian:1.13.7
          securityContext:
            seccompProfile:
              type: Unconfined
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Asia/Tokyo
            - name: DOCKER_MODS
              value: linuxserver/mods:universal-package-install
            - name: INSTALL_PACKAGES
              value: git|openssh-client
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: git-ssh
              mountPath: /config/.ssh
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: obsidian-config
        - name: git-ssh
          secret:
            secretName: obsidian-git-ssh
            defaultMode: 0400
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian
  namespace: obsidian
spec:
  selector:
    app: obsidian
  ports:
    - name: http
      port: 3000
      targetPort: http
