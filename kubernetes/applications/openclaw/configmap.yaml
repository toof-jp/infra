---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "controlUi": {
          "allowedOrigins": ["https://openclaw.toof.jp"]
        }
      },
      "plugins": {
        "entries": {
          "discord": {
            "enabled": true
          },
          "anthropic-vertex": {
            "enabled": true
          }
        }
      },
      "models": {
        "providers": {
          "anthropic-vertex": {
            "baseUrl": "https://aiplatform.googleapis.com",
            "api": "anthropic-messages",
            "apiKey": "gcp-vertex-credentials",
            "models": [
              {
                "id": "claude-sonnet-4-6",
                "name": "Claude Sonnet 4.6",
                "reasoning": true,
                "input": ["text", "image"],
                "cost": {
                  "input": 3,
                  "output": 15,
                  "cacheRead": 0.3,
                  "cacheWrite": 3.75
                },
                "contextWindow": 1000000,
                "maxTokens": 128000
              }
            ]
          }
        }
      },
      "channels": {
        "discord": {
          "enabled": true,
          "token": {
            "source": "env",
            "provider": "default",
            "id": "DISCORD_BOT_TOKEN"
          },
          "groupPolicy": "allowlist",
          "dmPolicy": "disabled",
          "guilds": {
            "1528017016407982250": {
              "requireMention": true,
              "channels": {
                "1528044116045332622": {
                  "enabled": true
                }
              }
            }
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "anthropic-vertex/claude-sonnet-4-6"
          }
        }
      },
      "cron": {
        "enabled": true
      }
    }
