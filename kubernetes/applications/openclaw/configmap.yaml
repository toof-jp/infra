---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "controlUi": {
          "allowedOrigins": ["https://openclaw.toof.jp"]
        }
      },
      "plugins": {
        "entries": {
          "discord": {
            "enabled": true
          }
        }
      },
      "models": {
        "providers": {
          "opencode-go": {
            "baseUrl": "https://opencode.ai/zen/go/v1",
            "api": "openai-completions",
            "apiKey": "${OPENCODE_API_KEY}",
            "models": [
              {
                "id": "mimo-v2.5",
                "name": "MiMo V2.5",
                "reasoning": true,
                "input": ["text", "image"],
                "cost": {
                  "input": 0.14,
                  "output": 0.28,
                  "cacheRead": 0.0028,
                  "cacheWrite": 0
                },
                "contextWindow": 1000000,
                "maxTokens": 128000
              }
            ]
          }
        }
      },
      "channels": {
        "discord": {
          "enabled": true,
          "token": {
            "source": "env",
            "provider": "default",
            "id": "DISCORD_BOT_TOKEN"
          },
          "groupPolicy": "allowlist",
          "dmPolicy": "disabled",
          "guilds": {
            "1528017016407982250": {
              "requireMention": true,
              "channels": {
                "1528044116045332622": {
                  "enabled": true
                }
              }
            }
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "opencode-go/mimo-v2.5"
          }
        }
      },
      "cron": {
        "enabled": true
      }
    }
