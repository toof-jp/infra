---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "controlUi": {
          "allowedOrigins": ["https://openclaw.toof.jp"]
        }
      },
      "plugins": {
        "entries": {
          "discord": {
            "enabled": true
          },
          "anthropic-vertex": {
            "enabled": true
          }
        }
      },
      "channels": {
        "discord": {
          "enabled": true,
          "token": {
            "source": "env",
            "provider": "default",
            "id": "DISCORD_BOT_TOKEN"
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": "anthropic-vertex/claude-sonnet-4-6"
          }
        }
      },
      "cron": {
        "enabled": true
      }
    }
