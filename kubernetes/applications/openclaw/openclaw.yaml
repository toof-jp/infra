---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-state
  namespace: openclaw
  labels:
    recurring-job-group.longhorn.io/daily: enabled
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      serviceAccountName: openclaw
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: install-kubectl
          image: curlimages/curl:8.21.0
          command:
            - sh
            - -c
            - >-
              VERSION=$(curl -fsSL https://dl.k8s.io/release/stable-1.36.txt) &&
              curl -fsSL "https://dl.k8s.io/release/${VERSION}/bin/linux/amd64/kubectl"
              -o /tools/kubectl &&
              chmod 0755 /tools/kubectl
          volumeMounts:
            - name: tools
              mountPath: /tools
        - name: copy-config
          image: curlimages/curl:8.21.0
          command:
            - sh
            - -c
            - >-
              cp /config-src/openclaw.json /state/openclaw.json &&
              chmod 664 /state/openclaw.json
          volumeMounts:
            - name: config
              mountPath: /config-src
              readOnly: true
            - name: state
              mountPath: /state
              subPath: openclaw
      containers:
        - name: openclaw
          image: ghcr.io/openclaw/openclaw:2026.7.1
          ports:
            - name: http
              containerPort: 18789
          env:
            - name: PATH
              value: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json
            - name: GOOGLE_CLOUD_PROJECT
              value: toof-infra
            - name: GOOGLE_CLOUD_LOCATION
              value: global
          envFrom:
            - secretRef:
                name: openclaw-secret
            - secretRef:
                name: openclaw-gateway-token-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
          volumeMounts:
            - name: state
              mountPath: /home/node/.openclaw
              subPath: openclaw
            - name: state
              mountPath: /home/node/.config/openclaw
              subPath: config
            - name: vertex-sa-key
              mountPath: /var/secrets/google
              readOnly: true
            - name: tools
              mountPath: /tools
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: openclaw-state
        - name: config
          configMap:
            name: openclaw-config
        - name: vertex-sa-key
          secret:
            secretName: openclaw-vertex-sa-key
            items:
              - key: GOOGLE_CREDENTIALS_JSON
                path: key.json
        - name: tools
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  selector:
    app: openclaw
  ports:
    - name: http
      port: 18789
      targetPort: 18789
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw
  namespace: openclaw
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: openclaw.toof.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openclaw
                port:
                  number: 18789
