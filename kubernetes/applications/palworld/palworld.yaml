---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: palworld-data
  namespace: palworld
  labels:
    recurring-job-group.longhorn.io/daily: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld
  namespace: palworld
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: palworld
  template:
    metadata:
      labels:
        app: palworld
    spec:
      nodeSelector:
        kubernetes.io/hostname: zen2
      securityContext:
        fsGroup: 1000
      containers:
        - name: palworld
          image: thijsvanloef/palworld-server-docker:v2.7.0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Asia/Tokyo
            - name: PORT
              value: "8211"
            - name: PLAYERS
              value: "16"
            - name: SERVER_NAME
              value: palworld
            - name: MULTITHREADING
              value: "true"
            - name: COMMUNITY
              value: "false"
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld-secret
                  key: SERVER_PASSWORD
          ports:
            - name: game
              containerPort: 8211
              protocol: UDP
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 16Gi
          volumeMounts:
            - name: data
              mountPath: /palworld
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: palworld-data
---
apiVersion: v1
kind: Service
metadata:
  name: palworld
  namespace: palworld
spec:
  type: NodePort
  selector:
    app: palworld
  ports:
    - name: game
      port: 8211
      targetPort: game
      protocol: UDP
      nodePort: 30211
